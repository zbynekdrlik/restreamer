# cargo-audit ignore list.
#
# cargo-audit reads this file automatically (project-local `.cargo/audit.toml`,
# see https://github.com/rustsec/rustsec cargo-audit config docs) -- no
# `--ignore` flags needed on the CLI. Moved out of the inline `--ignore` chain
# in .github/workflows/ci.yml (`security` job) so the list is reviewable in one
# place instead of growing silently in a CI script one flag at a time (#281).
#
# Every ID below MUST be paired with a comment directly above it in this exact
# shape, so the "Validate audit.toml" CI step (security job, ci.yml) can parse
# and enforce it:
#
#   # RUSTSEC-XXXX-YYYY: <why ignored> | dep: <path> | expires: YYYY-MM-DD
#
# When an entry's expiry date passes, that CI step FAILS the build -- forcing
# a periodic human re-check instead of an ignore living forever unreviewed.
# Entries were last re-checked 2026-11-19 (cargo audit with an empty ignore list
# against the current Cargo.lock); the next re-check is due 2027-01-31.

[advisories]
ignore = [
    # RUSTSEC-2023-0071: Marvin Attack timing side-channel in RSA PKCS#1 v1.5 decryption, no patched 0.9.x | dep: rsa 0.9 is a DEV-dependency of rs-api only (signs test Cloudflare Access JWTs in access_unit_tests.rs), never in a shipped binary, and nothing decrypts with it | expires: 2027-01-31
    "RUSTSEC-2023-0071",
    # RUSTSEC-2025-0134: rustls-pemfile is unmaintained (informational, repo archived) | dep: rustls-pemfile 1.0.4 <- reqwest 0.11 <- streamhub (vendored xiu RTMP stack) and 2.2.0 <- axum-server 0.7; no maintained drop-in reachable without those upstreams moving | expires: 2027-01-31
    "RUSTSEC-2025-0134",
    # RUSTSEC-2026-0194: quick-xml quadratic run time checking a start tag for duplicate attribute names (DoS), patched >=0.41.0 | dep: quick-xml 0.38.4 <- aws-creds <- rust-s3, which pins quick-xml ^0.38; quick-xml here only parses XML responses from our own trusted Hetzner S3 bucket, so the crafted-XML DoS is out of threat model | expires: 2027-01-31
    "RUSTSEC-2026-0194",
    # RUSTSEC-2026-0195: quick-xml unbounded namespace-declaration allocation (DoS), patched >=0.41.0 | dep: same quick-xml <- aws-creds <- rust-s3 chain as RUSTSEC-2026-0194, same trusted-input threat model | expires: 2027-01-31
    "RUSTSEC-2026-0195",
    # RUSTSEC-2026-0258: h2 unbounded empty DATA frames (DoS), patched >=0.4.16 | dep: h2 0.3.27 <- hyper 0.14 <- reqwest 0.11 <- streamhub <- rtmp (vendored xiu RTMP stack, #354); h2 has NO patched 0.3.x release, and reqwest here is an outbound HTTP CLIENT (not an inbound HTTP/2 server), so the attack needs us to connect to a malicious HTTP/2 peer, not an inbound RTMP publisher | expires: 2027-01-31
    "RUSTSEC-2026-0258",
    # RUSTSEC-2026-0459: bundled SQLite <3.54.0 can return uninitialized page-cache memory when a db is opened with a -wal of a different page size, patched libsqlite3-sys >=0.39 | dep: libsqlite3-sys 0.30.1 <- sqlx-sqlite 0.8.6 (pins ^0.30; the fix needs sqlx 0.9, tracked in #431); only our own process writes restreamer.db and its -wal, so no less-trusted party can plant the files | expires: 2027-01-31
    "RUSTSEC-2026-0459",
]
