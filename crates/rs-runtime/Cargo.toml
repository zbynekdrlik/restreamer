[package]
name = "rs-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Restreamer service runtime - embeddable service core for Tauri and standalone use"

[dependencies]
rs-core.workspace = true
rs-inpoint.workspace = true
rs-endpoint.workspace = true
rs-api.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
sqlx.workspace = true
serde_json.workspace = true
chrono.workspace = true
log.workspace = true
# #323: the stream-pp upgrade check (GitHub release, minisign signature).
reqwest.workspace = true
serde.workspace = true
base64.workspace = true
semver = "1"
minisign-verify = "0.2"

# #367 part 2: the process-stall detector's resource snapshot. Windows uses the
# exact psapi/kernel32 counters (handles, kernel pools, commit); elsewhere a
# sysinfo memory-only fallback keeps Linux CI compiling and testing the path.
# Both versions are the ones already in Cargo.lock (no new packages).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[target.'cfg(not(windows))'.dependencies]
sysinfo = { version = "0.37", default-features = false, features = ["system"] }

[dev-dependencies]
reqwest = { workspace = true, features = ["json"] }
tempfile = "3"
# #404: bridge a real `log` record in the refused-subscribe filter tests.
tracing-log = "0.2"
wiremock = "0.6"
axum.workspace = true
serde_json = { workspace = true }
tokio = { workspace = true }
rs-core = { workspace = true }
rs-inpoint = { workspace = true }
rs-api = { workspace = true }
# #368: the in-process RTMP publisher for the ingest-isolation tests.
rs-rtmp-push = { workspace = true }
