[package]
name = "rs-inpoint"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
rs-core.workspace = true
rs-rtmp-push.workspace = true
tokio.workspace = true
bytes.workspace = true
tracing.workspace = true
thiserror.workspace = true
md-5.workspace = true
log.workspace = true
serde_json.workspace = true

# xiu RTMP ecosystem
rtmp.workspace = true
streamhub.workspace = true

[dev-dependencies]
# The media_receiver tests drive run() under a paused clock
# (`tokio::time::pause` / `start_paused`), which needs `test-util`. Declared
# here so `cargo test -p rs-inpoint` (and cargo-mutants, which tests the
# mutated package alone) builds without relying on feature unification from
# another workspace crate.
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"
md-5 = { workspace = true }
bytes = { workspace = true }
env_logger = "0.11"
tracing-subscriber = { workspace = true }
